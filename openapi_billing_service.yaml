openapi: 3.0.3
info:
  title: Billing Service API
  version: 1.0.0
  description: API for managing billing and payments

servers:
  - url: http://localhost:9006

paths:

  /health:
    get:
      summary: Health Check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /v1/bills:
    get:
      summary: Get bills
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: patient_id
          in: query
          schema:
            type: integer
        - name: appointment_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, PAID, VOID, REFUND]
      responses:
        "200":
          description: List of bills
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/bills/{bill_id}:
    get:
      summary: Get bill by ID
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bill details
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/bills/generate-from-appointment/{appointment_id}:
    post:
      summary: Generate bill from appointment
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bill generated
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/bills/handle-cancellation/{appointment_id}:
    post:
      summary: Handle cancellation billing logic
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: Cancellation handled
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/bills/{bill_id}/adjust:
    post:
      summary: Adjust bill
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "200":
          description: Bill adjusted
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  schemas:

    BillResponse:
      type: object
      properties:
        bill_id:
          type: integer
        patient_id:
          type: integer
        appointment_id:
          type: integer
        base_amount:
          type: number
          format: float
        tax_amount:
          type: number
          format: float
        total_amount:
          type: number
          format: float
        status:
          type: string
          enum: [OPEN, PAID, VOID, REFUND]
        created_at:
          type: string
          format: date-time

    CancelRequest:
      type: object
      required:
        - penalty
      properties:
        penalty:
          type: number
          minimum: 0
          maximum: 1
          description: Penalty percentage (0 to 1)

    AdjustmentRequest:
      type: object
      required:
        - adjustment_amount
        - reason
      properties:
        adjustment_amount:
          type: number
        reason:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
        details:
          type: array
          items:
            type: object

  responses:

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"